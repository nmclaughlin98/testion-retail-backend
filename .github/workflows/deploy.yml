name: 2. Deploy to Production

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number to deploy (e.g. 42)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Download the specific build artifact matching the build_number input
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-${{ github.event.inputs.build_number }}
          path: cdk.out

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Deploys directly from pre-synthesized cdk.out directory
      - name: Deploy CDK Stack
        run: npx cdk deploy --app cdk.out --require-approval never