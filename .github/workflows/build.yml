name: 1. Build and Package

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ github.run_number }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --include=dev

      - name: Check TypeScript Compilation
        run: npm run build

      - name: Synthesize CDK App
        run: npx cdk synth

      # Uploads the app folder as an artifact tagged with the Run Number
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ github.run_number }}
          path: app/
          retention-days: 7

      - name: Display Build Number
        run: |
          echo "Build Number: ${{ github.run_number }}"
          echo "### 🚀 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Build Number:** \`${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact Name:** \`build-artifact-${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY